[project]
name = "repolens"
version = "0.1.0"
description = "Agentic Q&A over GitHub repositories with citations checked against the pinned commit"
readme = "README.md"
license = "MIT"
authors = [{ name = "Ansh Chhikara" }]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.9.0",
    "fastapi>=0.142.2",
    "fastembed>=0.8.1",
    "google-genai>=2.25.0",
    "httpx>=0.28.1",
    "httpx2>=2.13.1",
    "openai>=3.19.2",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "tree-sitter>=0.25,<0.26",  # 0.26.0 over-releases Point.row ints and segfaults
    "tree-sitter-python>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
    "typer>=0.12",
    "uvicorn>=0.54.0",
]

[project.scripts]
repolens = "repolens.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pre-commit>=3.7",
    "pyright>=1.1.380",
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["tests/fixtures"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
exclude = ["tests/fixtures"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false  # fastembed ships inline types without a py.typed marker

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
