[project]
name = "repolens"
version = "0.1.0"
description = "Multi-agent Q&A over GitHub repositories with verifiable citations, a per-run cost cap and guardrails"
readme = "README.md"
license = "MIT"
authors = [{ name = "Ansh Chhikara" }]
requires-python = ">=3.12"
dependencies = [
    "fastembed>=0.8.1",
    "httpx2>=2.13.1",
    "langchain>=1.4.2",
    "langchain-google-genai>=4.4.0",
    "langgraph>=1.2.12",
    "openai>=3.19.2",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0.3",
    "tree-sitter>=0.25,<0.26",  # 0.26.0 over-releases Point.row ints and segfaults
    "tree-sitter-python>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
    "typer>=0.12",
]

[project.scripts]
repolens = "repolens.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pre-commit>=3.7",
    "pyright>=1.1.380",
    "pytest>=8.3",
    "ruff>=0.6",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["tests/fixtures"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
exclude = ["tests/fixtures"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false  # langgraph ships inline types without a py.typed marker

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
