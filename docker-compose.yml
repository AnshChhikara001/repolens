name: repolens

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: repolens
      POSTGRES_PASSWORD: repolens
      POSTGRES_DB: repolens
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    configs:
      - source: enable-pgvector
        target: /docker-entrypoint-initdb.d/01-pgvector.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repolens -d repolens"]
      interval: 2s
      timeout: 3s
      retries: 15

configs:
  enable-pgvector:
    content: CREATE EXTENSION IF NOT EXISTS vector;

volumes:
  pgdata:
